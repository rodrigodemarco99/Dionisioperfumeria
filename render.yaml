services:
  - type: static
    name: dionisio-perfumeria
    buildCommand: npm install -g pnpm && pnpm install && PORT=10000 BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/dionisio-perfumeria run build
    staticPublishPath: artifacts/dionisio-perfumeria/dist/public
    env:
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: "/"
      - key: NODE_ENV
        value: production
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
